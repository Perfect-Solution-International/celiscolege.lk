# This is the config actually installed at /etc/nginx/sites-available/celiscollege.lk
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/celiscollege.lk
#   sudo ln -s /etc/nginx/sites-available/celiscollege.lk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates are already issued by certbot for celiscollege.lk + www.

# nginx site config for celiscollege.lk
# Reverse proxy to the Next.js standalone server (pm2 process "celiscollege").

upstream celiscollege_app {
    server 127.0.0.1:3002;
    keepalive 32;
}

# Port 80 -> https, both hostnames.
server {
    listen 80;
    listen [::]:80;
    server_name celiscollege.lk www.celiscollege.lk;
    return 301 https://celiscollege.lk$request_uri;
}

# Redirect www to the canonical host, so Google indexes one hostname only.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.celiscollege.lk;

    ssl_certificate /etc/letsencrypt/live/celiscollege.lk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/celiscollege.lk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://celiscollege.lk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name celiscollege.lk;

    ssl_certificate /etc/letsencrypt/live/celiscollege.lk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/celiscollege.lk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml
        application/manifest+json;

    # Hashed build assets never change - cache them hard.
    location /_next/static/ {
        proxy_pass http://celiscollege_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images and fonts served from /public.
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        proxy_pass http://celiscollege_app;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://celiscollege_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The app reads this to rate-limit enquiries per visitor.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
