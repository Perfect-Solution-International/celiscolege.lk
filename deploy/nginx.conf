# nginx site config for celiscollege.lk
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/celiscollege.lk
#   sudo ln -s /etc/nginx/sites-available/celiscollege.lk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d celiscollege.lk -d www.celiscollege.lk
#
# Certbot rewrites this file to add the TLS block and the port 80 redirect.

upstream celiscollege_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect www to the canonical host, so Google indexes one hostname only.
server {
    listen 80;
    listen [::]:80;
    server_name www.celiscollege.lk;
    return 301 https://celiscollege.lk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name celiscollege.lk;

    # Certbot replaces this with a 301 to https once certificates are issued.

    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml
        application/manifest+json;

    # Hashed build assets never change - cache them hard.
    location /_next/static/ {
        proxy_pass http://celiscollege_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images and fonts served from /public.
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        proxy_pass http://celiscollege_app;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://celiscollege_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The app reads this to rate-limit enquiries per visitor.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
